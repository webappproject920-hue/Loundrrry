>⇩ Export CSV</button>')+`<section class="panel"><div class="panel-head"><div><h3>Ringkasan Pendapatan</h3><p>Data contoh, bukan laporan keuangan riil.</p></div><div class="segments"><button class="${reportPeriod==='day'?'active':''}" onclick="setReport('day')">Harian</button><button class="${reportPeriod==='month'?'active':''}" onclick="setReport('month')">Bulanan</button><button class="${reportPeriod==='year'?'active':''}" onclick="setReport('year')">Tahunan</button></div></div><div class="grid4" style="margin-top:0"><div class="metric"><p>Omzet Periode</p><h4>${money(sum(a))}</h4></div><div class="metric"><p>Total Transaksi</p><h4>${a.length}</h4></div><div class="metric"><p>Total Berat</p><h4>${a.reduce((s,o)=>s+o.kg,0)} kg</h4></div><div class="metric"><p>Rata-rata / Transaksi</p><h4>${money(sum(a)/(a.length||1))}</h4></div></div><h3 style="font-size:14px;margin-top:25px">Omzet Berdasarkan Layanan</h3>${Object.entries(svc).map(([n,v])=>`<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px"><b>${n}</b><span>${money(v)}</span></div><div style="height:9px;border-radius:9px;background:#edf1f6;overflow:hidden"><div style="height:100%;width:${sum(a)?v/sum(a)*100:0}%;background:${n==='Standar'?'#176eb1':n==='Premium'?'#10a879':'#8b5cf6'}"></div></div></div>`).join('')}<div class="tablewrap" style="margin-top:20px"><table><thead><tr><th>Transaksi</th><th>Pelanggan</th><th>Tanggal</th><th>Layanan</th><th>Berat</th><th>Omzet</th></tr></thead><tbody>${a.map(o=>`<tr><td>${o.id}</td><td>${esc(o.name)}</td><td>${datefmt(o.date)}</td><td>${o.service}</td><td>${o.kg} kg</td><td><b>${money(o.total)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada transaksi pada periode ini.</td></tr>'}</tbody></table></div></section>`}function settingsPage(){return header('Pengaturan','Konfigurasi dasar untuk pratinjau aplikasi.')+`<section class="panel"><div class="panel-head"><div><h3>Tarif Layanan Laundry</h3><p>Tarif demo sesuai kebutuhan awal.</p></div></div><div class="grid4" style="margin-top:0"><div class="metric"><div class="metric-icon blue">🧺</div><h4>Rp6.000</h4><p>Standar / kg</p></div><div class="metric"><div class="metric-icon green">✨</div><h4>Rp10.000</h4><p>Premium / kg</p></div><div class="metric"><div class="metric-icon purple">👑</div><h4>Rp13.000</h4><p>Super / kg</p></div><div class="metric"><div class="metric-icon orange">＋</div><h4>Opsional</h4><p>Biaya satuan / tambahan</p></div></div><p style="margin-top:22px;padding:14px;background:#fff8e8;border-radius:10px;color:#855d1a;font-size:12px;line-height:1.6">⚠️ Ini prototipe antarmuka. Data hanya disimpan sementara di memori halaman dan kembali ke data contoh saat halaman dimuat ulang. Belum ada login asli, server, atau database.</p></section>`}
function render(){let f={dashboard,orders:ordersPage,customers:customersPage,inventory:inventoryPage,history:historyPage,racks:racksPage,reports:reportsPage,settings:settingsPage};$('#topTitle').textContent=meta[page][0];$('#topSub').textContent=meta[page][1];$('#content').innerHTML=f[page]();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')}function go(p){page=p;query='';render();window.scrollTo({top:0,behavior:'smooth'})}function setChart(p){chartPeriod=p;render()}function setReport(p){reportPeriod=p;render()}function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.remove('show'),2500)}function modal(t,h){$('#modalTitle').textContent=t;$('#modalbody').innerHTML=h;$('#modalback').classList.add('show')}function closeModal(){$('#modalback').classList.remove('show')}
function openOrder(o=null){let editing=!!o;modal(editing?'Edit Transaksi':'Transaksi Laundry Baru',`<form id="orderForm"><div class="formgrid"><div class="field"><label>Nama Pelanggan *</label><input name="name" required value="${esc(o?.name||'')}" placeholder="Nama lengkap"></div><div class="field"><label>Nomor HP</label><input name="phone" value="${esc(o?.phone||'')}" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Layanan *</label><select name="service">${['Standar','Premium','Super'].map(s=>`<option ${o?.service===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Berat (kg) *</label><input name="kg" type="number" min=".1" step=".1" required value="${o?.kg??''}" placeholder="Contoh 4.5"></div><div class="field"><label>Biaya satuan (Rp)</label><input name="unit" type="number" min="0" value="${o?.unit||0}"></div><div class="field"><label>Biaya tambahan (Rp)</label><input name="extra" type="number" min="0" value="${o?.extra||0}"></div><div class="field"><label>Status</label><select name="status">${['Menunggu','Proses Cuci','Selesai','Siap Diambil','Diambil'].map(s=>`<option ${o?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Lokasi Rak</label><input name="rack" value="${esc(o?.rack==='-'?'':o?.rack||'')}" placeholder="Mis. A-01"></div><div class="field full"><label>Catatan</label><textarea name="note" placeholder="Catatan khusus (opsional)">${esc(o?.note||'')}</textarea></div></div><div style="background:#f3f8fd;border-radius:10px;padding:12px;margin-top:14px;font-size:12px;display:flex;justify-content:space-between"><span>Estimasi total</span><b id="estimate">${money(o?.total||0)}</b></div><div class="formactions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary">${editing?'Simpan Perubahan':'Simpan Transaksi'}</button></div></form>`);let f=$('#orderForm');function calc(){let rates={Standar:6000,Premium:10000,Super:13000};$('#estimate').textContent=money((+f.kg.value||0)*rates[f.service.value]+(+f.unit.value||0)+(+f.extra.value||0))}f.addEventListener('input',calc);f.addEventListener('change',calc);f.addEventListener('submit',e=>{e.preventDefault();let d=new FormData(f),rates={Standar:6000,Premium:10000,Super:13000},data={name:d.get('name').trim(),phone:d.get('phone'),service:d.get('service'),kg:+d.get('kg'),unit:+d.get('unit')||0,extra:+d.get('extra')||0,status:d.get('status'),rack:d.get('rack')||'-',note:d.get('note'),total:+d.get('kg')*rates[d.get('service')]+(+d.get('unit')||0)+(+d.get('extra')||0)};if(editing)Object.assign(o,data);else orders.unshift({...data,id:'RL-'+(1025+orders.length-6),date:new Date()});closeModal();render();toast('Transaksi tersimpan pada demo.')})}function editOrder(id){let o=orders.find(o=>o.id===id);if(o)openOrder(o)}
function openStock(s=null,i=-1){modal(s?'Edit Bahan':'Tambah Jenis Bahan',`<form id="stockForm"><div class="formgrid"><div class="field full"><label>Nama Bahan *</label><input name="name" required value="${esc(s?.name||'')}" placeholder="Mis. Deterjen cair"></div><div class="field"><label>Jumlah Stok *</label><input name="qty" type="number" min="0" step=".1" required value="${s?.qty??''}"></div><div class="field"><label>Satuan</label><select name="unit">${['liter','kg','gram','pcs','botol','pak'].map(u=>`<option ${s?.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field full"><label>Batas Minimum Stok</label><input name="min" type="number" min="0" step=".1" value="${s?.min??0}"></div></div><div class="formactions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan Bahan</button></div></form>`);$('#stockForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),d={name:f.get('name').trim(),qty:+f.get('qty'),unit:f.get('unit'),min:+f.get('min')||0};if(s)Object.assign(s,d);else stock.push(d);closeModal();render();toast('Data bahan disimpan pada demo.')})}function editStock(i){openStock(stock[i],i)}function moveStock(i){movementForm(stock[i])}function openMove(){movementForm(null)}function movementForm(s){modal('Catat Pergerakan Stok',`<form id="moveForm"><div class="formgrid"><div class="field full"><label>Nama Bahan</label><select name="name">${stock.map(x=>`<option ${s?.name===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Jenis</label><select name="type"><option>Masuk</option><option>Keluar</option></select></div><div class="field"><label>Jumlah</label><input name="qty" type="number" min=".1" step=".1" required></div><div class="field full"><label>Catatan</label><input name="note" placeholder="Pembelian stok / pemakaian"></div></div><div class="formactions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan</button></div></form>`);$('#moveForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),x=stock.find(x=>x.name===f.get('name')),q=+f.get('qty'),type=f.get('type');if(type==='Keluar'&&q>x.qty){toast('Stok tidak mencukupi.');return}x.qty+=type==='Masuk'?q:-q;moves.push({date:new Date(),name:x.name,type,qty:q,unit:x.unit,note:f.get('note')});closeModal();render();toast('Riwayat stok ditambahkan pada demo.')})}function filterOrders(v){query=v;let a=orders.filter(o=>(o.name+' '+o.id+' '+o.phone).toLowerCase().includes(v.toLowerCase()));$('#orderRows').innerHTML=tableOrders(a)}function filterTable(v,id){document.querySelectorAll('#'+id+' tr[data-search]').forEach(r=>r.style.display=r.dataset.search.includes(v.toLowerCase())?'':'none')}function filterMoves(v){$('#moveRows').innerHTML=moveRows(moves.filter(m=>!v||m.type===v))}function exportCSV(){let rows=[['ID','Tanggal','Pelanggan','HP','Layanan','Kg','Total','Status','Rak'],...orders.map(o=>[o.id,datefmt(o.date),o.name,o.phone,o.service,o.kg,o.total,o.status,o.rack])],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download='raja-laundry-transaksi.csv';a.click();URL.revokeObjectURL(a.href);toast('File CSV berhasil dibuat.')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#menuBtn').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('show')});$('#overlay').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')});$('#close').addEventListener('click',closeModal);$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){query=e.target.value;go('orders');$('#globalSearch').value=query;let inp=document.querySelector('#content input.search');if(inp)inp.value=query;filterOrders(query)}});$('#notification').addEventListener('click',()=>toast(`${orders.filter(o=>o.status==='Siap Diambil').length} cucian siap diambil · ${stock.filter(s=>s.qty<=s.min).length} stok perlu dicek`));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
